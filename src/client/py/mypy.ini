[mypy]
check_untyped_defs = True
warn_return_any = True

[mypy-connectrpc.*]
ignore_missing_imports = True

[mypy-pylabrobot.*]
ignore_missing_imports = True

[mypy-google.protobuf.*]
ignore_missing_imports = True

[mypy-pylabrobot_protobuf_service.*]
ignore_missing_imports = True

[mypy-pylabrobot_protobuf_client.star._iswap]
# STARBackend.RotationDriveOrientation alias not resolvable as a type
# because pylabrobot lacks py.typed — matches upstream behavior.
disable_error_code = valid-type, no-any-return
