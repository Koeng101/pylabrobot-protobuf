[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pylabrobot-protobuf-service"
version = "0.1.0"
description = "ConnectRPC service implementations for PyLabRobot"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "pylabrobot",
  "connect-python>=0.8.1",
  "uvicorn>=0.34.0",
  "protobuf>=5.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.2.1",
  "mypy==1.18.2",
  "types-protobuf>=4.24",
]

[tool.setuptools.packages.find]
namespaces = false

[tool.setuptools.package-data]
pylabrobot_protobuf_service = ["py.typed"]

[tool.ruff]
line-length = 100
indent-width = 2

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
